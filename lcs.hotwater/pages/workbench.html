<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>热开水人设台</title>
<link rel="stylesheet" href="/__aicode/theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--aicode-bg, #0e1116);
    color: var(--aicode-on-surface, #e6e8ec);
    font-size: calc(14px * var(--aicode-font-scale, 1));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { width: 100%; max-width: 1080px; margin: 0 auto; padding: 16px 16px 56px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    background: linear-gradient(140deg, #ff7a45, #e8412c 55%, #8f1d12);
    box-shadow: 0 3px 12px rgba(232, 65, 44, .32);
    display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff;
  }
  h1 { margin: 0; font-size: 1.2em; font-weight: 680; letter-spacing: .01em; }
  .sub { margin: 2px 0 0; font-size: .78em; opacity: .58; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    font: inherit; border-radius: 9px; padding: 8px 14px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--aicode-border, rgba(128,128,128,.3));
    background: var(--aicode-surface, rgba(255,255,255,.05));
    color: inherit; transition: opacity .15s, background .15s, border-color .15s;
    min-height: 36px;
  }
  button:hover { background: rgba(128,128,128,.16); }
  button:disabled { opacity: .42; cursor: default; }
  button.primary { background: var(--aicode-primary, #2f6fed); border-color: transparent; color: #fff; font-weight: 620; }
  button.primary:hover { opacity: .9; background: var(--aicode-primary, #2f6fed); }
  button.hot { background: linear-gradient(135deg, #e8412c, #b8281a); border-color: transparent; color: #fff; font-weight: 620; }
  button.hot:hover { opacity: .9; background: linear-gradient(135deg, #e8412c, #b8281a); }
  button.mini { padding: 6px 11px; font-size: .82em; border-radius: 7px; min-height: 32px; }
  button.ghost { border-color: transparent; background: transparent; opacity: .72; }
  button.ghost:hover { opacity: 1; background: rgba(128,128,128,.14); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .card {
    background: var(--aicode-surface, rgba(255,255,255,.04));
    border: 1px solid var(--aicode-border, rgba(128,128,128,.18));
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 12px;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .card-title { font-size: .86em; font-weight: 640; letter-spacing: .02em; }
  .card-note { font-size: .73em; opacity: .5; text-align: right; }

  .seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; }
  .seat {
    position: relative; text-align: left; padding: 10px 12px 9px; border-radius: 10px; line-height: 1.35; min-height: 62px;
    border: 1px solid var(--aicode-border, rgba(128,128,128,.2));
    background: rgba(255,255,255,.02);
  }
  .seat .idx { font-size: .7em; font-weight: 640; opacity: .95; font-variant-numeric: tabular-nums; }
  .seat .nm { font-size: .88em; font-weight: 620; margin-top: 1px; }
  .seat .dt { font-size: .73em; opacity: .72; margin-top: 3px; }
  .seat.on { border-color: rgba(232,65,44,.9); background: rgba(232,65,44,.09); box-shadow: inset 0 0 0 1px rgba(232,65,44,.45); }
  .seat.on::after {
    content: "✓"; position: absolute; top: 7px; right: 9px; font-size: .74em;
    color: #e8412c; opacity: .95;
  }

  .modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .mode {
    text-align: left; padding: 9px 11px; border-radius: 10px; line-height: 1.3; min-height: 62px;
    border: 1px solid var(--aicode-border, rgba(128,128,128,.2));
    background: rgba(255,255,255,.02);
  }
  .mode .lb { font-size: .74em; font-weight: 700; letter-spacing: .06em; opacity: .86; }
  .mode .ti { font-size: .86em; font-weight: 620; margin-top: 1px; }
  .mode .dt { font-size: .72em; opacity: .66; margin-top: 3px; }
  .mode.on { border-color: rgba(232,65,44,.9); background: rgba(232,65,44,.09); box-shadow: inset 0 0 0 1px rgba(232,65,44,.45); position: relative; }
  .mode.on::after {
    content: "✓"; position: absolute; top: 7px; right: 9px; font-size: .74em; color: #e8412c;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; font-size: .79em; line-height: 1.35; min-height: 34px;
    border: 1px solid var(--aicode-border, rgba(128,128,128,.24));
    background: rgba(255,255,255,.02);
    max-width: 100%; overflow-wrap: anywhere;
  }
  .chip b { font-weight: 640; letter-spacing: .03em; opacity: .82; font-size: .94em; }
  .chip span { opacity: .66; margin-left: 6px; }
  .chip.on { border-color: rgba(232,65,44,.9); background: rgba(232,65,44,.09); }
  .chip.on b { opacity: 1; }

  select, input[type="text"], textarea {
    font: inherit; width: 100%; color: inherit; border-radius: 9px; padding: 8px 10px;
    border: 1px solid var(--aicode-border, rgba(128,128,128,.28));
    background: var(--aicode-bg, rgba(0,0,0,.2));
  }
  textarea { resize: vertical; line-height: 1.5; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--aicode-primary, #2f6fed); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > .grow { flex: 1 1 160px; min-width: 0; }
  .label { font-size: .76em; opacity: .7; margin-bottom: 5px; display: block; }

  pre.out {
    margin: 0; padding: 12px; border-radius: 10px; max-height: 340px; overflow: auto;
    background: rgba(0,0,0,.34); border: 1px solid var(--aicode-border, rgba(128,128,128,.16));
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .78em; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .empty { font-size: .8em; opacity: .45; padding: 10px 2px; }

  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 10px; }
  .stat div {
    background: rgba(255,255,255,.03); border: 1px solid var(--aicode-border, rgba(128,128,128,.16));
    border-radius: 9px; padding: 7px 9px;
  }
  .stat .k { font-size: .7em; opacity: .62; }
  .stat .v { font-size: 1.05em; font-weight: 660; margin-top: 1px; font-variant-numeric: tabular-nums; }

  .tgt { display: flex; align-items: center; gap: 8px; padding: 5px 2px; border-bottom: 1px solid rgba(128,128,128,.1); font-size: .8em; }
  .tgt:last-child { border-bottom: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: rgba(128,128,128,.4); }
  .dot.on { background: #35c26a; }
  .dot.pre { background: #c9a227; }
  .tgt .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tgt .tag { font-size: .9em; opacity: .6; }

  .log { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; }
  .log div { font-size: .76em; line-height: 1.45; opacity: .8; padding-left: 46px; position: relative; }
  .log div::before {
    content: attr(data-t); position: absolute; left: 0; opacity: .5;
    font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; font-size: .92em;
  }
  .log div.err { color: var(--aicode-error, #ef5b5b); opacity: .95; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(12px);
    background: rgba(20,24,30,.96); color: #fff; border: 1px solid rgba(128,128,128,.3);
    padding: 8px 15px; border-radius: 9px; font-size: .82em; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; z-index: 60; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand">
      <div class="mark">热</div>
      <div>
        <h1>热开水 · 本地优先</h1>
        <p class="sub">七席位 / 五档位 / 五工作链</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-refresh" class="mini">重新检查</button>
      <button id="btn-open-config" class="mini">设置</button>
    </div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <div class="card-head">
          <span class="card-title">席位</span>
          <span class="card-note">一个会话只认一个席位，总控包兜底</span>
        </div>
        <div class="seats" id="seats"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-title">工作档位</span>
          <span class="card-note" id="mode-note">MAX · 完整、直接、可继续</span>
        </div>
        <div class="modes" id="modes"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-title">工作链</span>
          <span class="card-note">未选时按档位自动配</span>
        </div>
        <div class="chips" id="chains"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-title">目标与通道</span>
          <span class="card-note" id="goal-count">0 字</span>
        </div>
        <label class="label" for="goal">你要处理什么</label>
        <textarea id="goal" rows="3" placeholder="输入目标、问题或要整理的文本…"></textarea>
        <div class="row" style="margin-top:9px">
          <div class="grow">
            <label class="label" for="channel">工程通道</label>
            <select id="channel"></select>
          </div>
          <div class="grow">
            <label class="label" for="tone">语气</label>
            <input id="tone" type="text" placeholder="留空取默认">
          </div>
        </div>
        <div class="row" style="margin-top:10px">
          <button id="btn-build" class="primary">生成注入包</button>
          <button id="btn-inject" class="hot">注入</button>
          <button id="btn-matrix" class="mini">全席位一次生成</button>
          <button id="btn-clear" class="ghost mini">清空输入</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-title">注入包</span>
          <span class="card-note" id="out-note">尚未生成</span>
        </div>
        <pre class="out" id="out">点「生成注入包」后显示完整文本。</pre>
        <div class="row" style="margin-top:9px">
          <button id="btn-copy" class="mini">复制</button>
          <button id="btn-dry" class="mini">预演写入</button>
          <span class="card-note" id="out-meta"></span>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-head">
          <span class="card-title">当前环境状态</span>
        </div>
        <div class="stat">
          <div><div class="k">已注入</div><div class="v" id="s-inj">-</div></div>
          <div><div class="k">目标</div><div class="v" id="s-tgt">-</div></div>
          <div><div class="k">席位</div><div class="v" id="s-seat">-</div></div>
        </div>
        <div id="targets"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-title">注入目标</span>
          <span class="card-note">勾选后注入</span>
        </div>
        <div class="chips" id="picks"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-title">操作记录</span>
          <button id="btn-log-clear" class="ghost mini">清空</button>
        </div>
        <div class="log" id="log"><div data-t="--:--:--">等待你的明确输入…</div></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/__aicode/aicode.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var state = {
    catalog: null,
    status: null,
    seat: 'master',
    mode: 'max',
    chains: [],
    channel: 'auto',
    picks: ['aicode'],
    markdown: '',
    busy: false
  };

  function invoke(handler, args) {
    if (!window.aicode || typeof window.aicode.invoke !== 'function') {
      return Promise.reject(new Error('宿主桥未就绪'));
    }
    return window.aicode.invoke(handler, args || {});
  }

  function toast(text) {
    var el = $('toast');
    el.textContent = String(text || '');
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  function clock() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function log(text, isError) {
    var box = $('log');
    var first = box.firstElementChild;
    if (first && first.getAttribute('data-t') === '--:--:--') box.removeChild(first);
    var row = document.createElement('div');
    row.setAttribute('data-t', clock());
    row.textContent = String(text || '');
    if (isError) row.className = 'err';
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }

  function copyText(text) {
    if (window.aicode && window.aicode.clipboard && window.aicode.clipboard.write) {
      return window.aicode.clipboard.write(text).then(function () { toast('已复制'); });
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { toast('已复制'); });
    }
    toast('复制不可用');
    return Promise.resolve();
  }

  function seatById(id) {
    var list = (state.catalog && state.catalog.seats) || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function modeById(id) {
    var list = (state.catalog && state.catalog.modes) || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function renderSeats() {
    var box = $('seats');
    box.innerHTML = '';
    ((state.catalog && state.catalog.seats) || []).forEach(function (seat) {
      var btn = document.createElement('button');
      btn.className = 'seat' + (seat.id === state.seat ? ' on' : '');
      btn.setAttribute('data-seat', seat.id);
      btn.innerHTML =
        '<div class="idx" style="color:' + seat.color + '">' + seat.index + ' &middot; ' + escapeHtml(seat.vendor) + '</div>' +
        '<div class="nm">' + escapeHtml(seat.title) + '</div>' +
        '<div class="dt">' + escapeHtml(seat.duty) + '</div>';
      box.appendChild(btn);
    });
  }

  function renderModes() {
    var box = $('modes');
    box.innerHTML = '';
    ((state.catalog && state.catalog.modes) || []).forEach(function (mode) {
      var btn = document.createElement('button');
      btn.className = 'mode' + (mode.id === state.mode ? ' on' : '');
      btn.setAttribute('data-mode', mode.id);
      btn.innerHTML =
        '<div class="lb">' + escapeHtml(mode.label) + '</div>' +
        '<div class="ti">' + escapeHtml(mode.title) + '</div>' +
        '<div class="dt">' + escapeHtml(mode.detail) + '</div>';
      box.appendChild(btn);
    });
    var mode = modeById(state.mode);
    $('mode-note').textContent = mode ? (mode.label + ' · ' + mode.detail) : '';
  }

  function renderChains() {
    var box = $('chains');
    box.innerHTML = '';
    ((state.catalog && state.catalog.chains) || []).forEach(function (chain) {
      var btn = document.createElement('button');
      btn.className = 'chip' + (state.chains.indexOf(chain.id) >= 0 ? ' on' : '');
      btn.setAttribute('data-chain', chain.id);
      btn.innerHTML = '<b>' + escapeHtml(chain.label) + '</b><span>' + escapeHtml(chain.detail) + '</span>';
      box.appendChild(btn);
    });
  }

  function renderChannels() {
    var sel = $('channel');
    sel.innerHTML = '';
    ((state.catalog && state.catalog.channels) || []).forEach(function (channel) {
      var opt = document.createElement('option');
      opt.value = channel.id;
      opt.textContent = channel.label + (channel.detail ? ' · ' + channel.detail : '');
      sel.appendChild(opt);
    });
    sel.value = state.channel;
  }

  function renderPicks() {
    var box = $('picks');
    box.innerHTML = '';
    ((state.catalog && state.catalog.targets) || []).forEach(function (target) {
      var btn = document.createElement('button');
      btn.className = 'chip' + (state.picks.indexOf(target.id) >= 0 ? ' on' : '');
      btn.setAttribute('data-pick', target.id);
      btn.title = target.note;
      btn.innerHTML = '<b>' + escapeHtml(target.name) + '</b>' + (target.reach === 'preview' ? '<span>预览</span>' : '');
      box.appendChild(btn);
    });
  }

  function renderStatus() {
    var snap = state.status;
    var box = $('targets');
    box.innerHTML = '';
    if (!snap) { box.innerHTML = '<div class="empty">还没有状态。</div>'; return; }
    $('s-inj').textContent = snap.injectedCount + ' / ' + snap.rows.length;
    $('s-tgt').textContent = snap.rows.filter(function (r) { return r.reach !== 'preview'; }).length;
    var seat = seatById(state.seat);
    $('s-seat').textContent = seat ? seat.index : '-';
    snap.rows.forEach(function (row) {
      var line = document.createElement('div');
      line.className = 'tgt';
      var dotClass = row.reach === 'preview' ? 'pre' : (row.injected ? 'on' : '');
      line.innerHTML =
        '<span class="dot ' + dotClass + '"></span>' +
        '<span class="nm" title="' + escapeHtml(row.note) + '">' + escapeHtml(row.name) + '</span>' +
        '<span class="tag">' + (row.reach === 'preview' ? '预览' : (row.injected ? '已注入' : '未注入')) + '</span>';
      box.appendChild(line);
    });
  }

  function escapeHtml(text) {
    return String(text === undefined || text === null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function buildArgs(extra) {
    var args = {
      seat: state.seat,
      mode: state.mode,
      chain: state.chains.slice(),
      channel: state.channel,
      goal: $('goal').value,
      tone: $('tone').value
    };
    if (extra) Object.keys(extra).forEach(function (k) { args[k] = extra[k]; });
    return args;
  }

  function showOutput(markdown, note) {
    state.markdown = markdown || '';
    $('out').textContent = state.markdown || '（空）';
    $('out-note').textContent = note || ('已生成 ' + state.markdown.length + ' 字');
    $('out-meta').textContent = state.markdown ? (state.markdown.length + ' 字 · ' + state.markdown.split('\n').length + ' 行') : '';
  }

  function loadAll() {
    setBusy(true);
    return invoke('ui.seats', {})
      .then(function (res) {
        state.catalog = res;
        var config = res.config || {};
        state.seat = config.seat || 'master';
        state.mode = config.mode || 'max';
        state.channel = config.channel || 'auto';
        renderSeats(); renderModes(); renderChains(); renderChannels(); renderPicks();
        return invoke('ui.status', {});
      })
      .then(function (snap) {
        state.status = snap;
        renderStatus();
        log(snap.message);
      })
      .catch(function (err) { log('加载失败：' + err.message, true); })
      .then(function () { setBusy(false); });
  }

  function setBusy(flag) {
    state.busy = flag;
    ['btn-build', 'btn-inject', 'btn-matrix', 'btn-dry'].forEach(function (id) {
      var el = $(id);
      if (el) el.disabled = flag && id !== 'btn-build';
    });
  }

  function doBuild(matrix) {
    if (state.busy) return;
    setBusy(true);
    log(matrix ? '生成全部席位…' : '生成注入包…');
    invoke('ui.build', buildArgs(matrix ? { matrix: true } : {}))
      .then(function (res) {
        showOutput(res.markdown, res.message);
        log(res.message);
      })
      .catch(function (err) { log('生成失败：' + err.message, true); })
      .then(function () { setBusy(false); });
  }

  function doInject(dryRun) {
    if (state.busy) return;
    if (!state.picks.length) { toast('先勾注入目标'); return; }
    if (!dryRun) {
      var names = state.picks.map(function (id) {
        var hit = null;
        ((state.catalog && state.catalog.targets) || []).forEach(function (t) { if (t.id === id) hit = t; });
        return hit ? hit.name : id;
      }).join('、');
      if (!window.confirm('将把热开水注入包写入：' + names + '。已有同名围栏会被整段替换，原文件会先备份。继续？')) return;
    }
    setBusy(true);
    var args = buildArgs({ targets: state.picks.slice(), confirm: true, dryRun: !!dryRun });
    invoke('ui.inject', args)
      .then(function (res) {
        showOutput(res.markdown, res.message);
        log(res.message);
        (res.results || []).forEach(function (item) {
          if (!item.ok) log(item.message, true);
          (item.files || []).forEach(function (file) {
            if (file.dryRun) log('  预演 ' + file.file + ' · ' + file.bytes + ' 字节');
            else if (file.written) log('  写入 ' + file.file, false);
          });
        });
        return invoke('ui.status', {});
      })
      .then(function (snap) { state.status = snap; renderStatus(); })
      .catch(function (err) { log('注入失败：' + err.message, true); })
      .then(function () { setBusy(false); });
  }

  function bind() {
    $('seats').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-seat]');
      if (!btn) return;
      state.seat = btn.getAttribute('data-seat');
      var seat = seatById(state.seat);
      renderSeats();
      log('席位 ' + (seat ? seat.title : state.seat) + ' 已选择');
    });

    $('modes').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-mode]');
      if (!btn) return;
      state.mode = btn.getAttribute('data-mode');
      var mode = modeById(state.mode);
      renderModes();
      log('档位 ' + (mode ? mode.label : state.mode) + ' 已启用');
    });

    $('chains').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-chain]');
      if (!btn) return;
      var id = btn.getAttribute('data-chain');
      var at = state.chains.indexOf(id);
      if (at >= 0) state.chains.splice(at, 1);
      else if (state.chains.length < 5) state.chains.push(id);
      renderChains();
    });

    $('picks').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-pick]');
      if (!btn) return;
      var id = btn.getAttribute('data-pick');
      var at = state.picks.indexOf(id);
      if (at >= 0) state.picks.splice(at, 1);
      else state.picks.push(id);
      renderPicks();
    });

    $('channel').addEventListener('change', function (event) {
      state.channel = event.target.value;
      log('工作通道 ' + event.target.value + ' 已选择');
    });

    $('goal').addEventListener('input', function (event) {
      $('goal-count').textContent = String(event.target.value.length) + ' 字';
    });

    $('btn-build').addEventListener('click', function () { doBuild(false); });
    $('btn-matrix').addEventListener('click', function () { doBuild(true); });
    $('btn-inject').addEventListener('click', function () { doInject(false); });
    $('btn-dry').addEventListener('click', function () { doInject(true); });
    $('btn-copy').addEventListener('click', function () {
      if (!state.markdown) { toast('还没有注入包'); return; }
      copyText(state.markdown);
    });
    $('btn-clear').addEventListener('click', function () {
      $('goal').value = '';
      $('goal-count').textContent = '0 字';
      state.chains = [];
      renderChains();
      log('输入已清空');
    });
    $('btn-refresh').addEventListener('click', function () { loadAll(); });
    $('btn-log-clear').addEventListener('click', function () {
      $('log').innerHTML = '';
      log('活动流已清空');
    });
    $('btn-open-config').addEventListener('click', function () {
      if (window.aicode && typeof window.aicode.openConfig === 'function') window.aicode.openConfig();
      else toast('设置页在插件设置里打开');
    });
  }

  bind();
  loadAll();
})();
</script>
</body>
</html>
